server.servlet.context-path=${CONTEXT_PATH:/umlp/api}
server.port=${PORT:8081}
umlp.service.websocket.impl=noAuth

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
mqtt.broker.url=tcp://localhost:1883
#spring.sql.init.mode=always
# No caching in browser during dev, otherwise old versions are displayed
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration,org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration